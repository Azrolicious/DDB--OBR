<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DDB-OBR Bridge</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1d1d24;
        --muted: #5d5d6c;
        --ok: #2e7d32;
        --warn: #a86b00;
        --line: #e3e1ec;
        --accent: #6a4fc9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #23263a;
          --text: #f2f1f7;
          --muted: #b3b1c4;
          --ok: #5fd68a;
          --warn: #ffc857;
          --line: #3c4057;
          --accent: #bb99ff;
        }
      }
      body {
        margin: 0;
        width: 300px;
        padding: 14px 16px;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .status {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      p,
      li {
        color: var(--muted);
        font-size: 12px;
      }
      ul {
        padding-left: 18px;
        margin: 4px 0 0;
        word-break: break-all;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>DDB-OBR Bridge</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="text">Checking D&amp;D Beyond…</span></div>
    <p id="hint"></p>
    <p>Read-only access is offered to these pages:</p>
    <ul id="sites"></ul>
    <script src="popup.js"></script>
  </body>
</html>
